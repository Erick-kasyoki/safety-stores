# Example Apache virtual hosts for a live server. Replace shop.example.com and the paths.
# Free certificate: install certbot, then  sudo certbot --apache -d shop.example.com  (renews itself).
<VirtualHost *:80>
    ServerName shop.example.com
    Redirect permanent / https://shop.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName shop.example.com
    DocumentRoot "/var/www/safety-store/public"      # only public/ is reachable; app/ and database/ stay private

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/shop.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shop.example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory "/var/www/safety-store/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
